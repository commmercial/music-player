name: Deploy Risk web app

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'audio-engine.js'
      - 'm3shapes.js'
      - 'lyrics-rtl.js'
      - 'track-sort.js'
      - 'search-text.js'
      - 'library-tools.js'
      - 'assets/**'
      - '.github/workflows/deploy-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Risk
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install mobile build tools
        working-directory: mobile
        run: npm ci
      - name: Build the web app
        working-directory: mobile
        run: npm run build
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site files
        uses: actions/upload-pages-artifact@v4
        with:
          path: mobile/www
      - name: Publish the web app
        id: deployment
        uses: actions/deploy-pages@v4
